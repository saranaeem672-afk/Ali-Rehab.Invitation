<!doctype html>
<html lang="en">

<head>
  <!-- إعدادات الصفحة -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241a16">

  <!-- عنوان الصفحة -->
  <title>Ali &amp; Rehab | Engagement Invitation</title>

  <!-- تحميل الخط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    /* الألوان الأساسية */
    :root {
      --gold: #d2b77d;
      --cream: #f5ebd8;
      --dark: #211815;
    }

    /* توحيد حساب الأحجام */
    * {
      box-sizing: border-box;
    }

    /* تنسيق الصفحة */
    body {
      margin: 0;
      background: var(--dark);
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    /* تنسيق الأزرار */
    button {
      font: inherit;
    }

    /* القسم الرئيسي */
    .experience {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: var(--dark);
    }

    /* صورة الباب المقفول */
    .experience::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;

      background:
        linear-gradient(#160e0870, #160e0844 42%, #160e0877),
        url("images/place-door.jpg") center / cover no-repeat;

      opacity: 1;
      transform: scale(1);
      filter: blur(0);

      transition:
        opacity 1.5s ease,
        transform 2s cubic-bezier(.7, 0, .2, 1),
        filter 1.5s ease;
    }

    /* صورة الباب المفتوح */
    .experience::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;

      background:
        linear-gradient(#160e0870, #160e0844 42%, #160e0877),
        url("images/Open.jpeg") center / cover no-repeat;

      opacity: 0;
      transform: scale(1.15);
      filter: blur(8px);

      transition:
        opacity 2s ease,
        transform 2.5s cubic-bezier(.2, .8, .2, 1),
        filter 2s ease;
    }

    /* حركة اختفاء الباب المقفول */
    .experience.door-open::before {
      opacity: 0;
      transform: scale(1.2) rotateY(-8deg);
      filter: blur(5px);
    }

    /* حركة ظهور الباب المفتوح */
    .experience.door-open::after {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }

    /* تفاصيل الدعوة */
    .reveal {
      position: relative;
      z-index: 1;

      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 35px 16px;
      text-align: center;

      opacity: 0;
      transform: translateY(18px) scale(.985);

      transition:
        opacity 1.2s ease .3s,
        transform 1.2s ease .3s;
    }

    /* ظهور تفاصيل الدعوة */
    .experience.opened .reveal {
      opacity: 1;
      transform: none;
    }

    /* صندوق الدعوة */
    .content {
      width: min(560px, 100%);
      padding: 20px;

      background: linear-gradient(180deg, #2119147a, #211914b8);

      backdrop-filter: blur(2px);

      border: 1px solid #d2b77d88;

      box-shadow: 0 20px 80px #100a08a8;
    }

    /* إطار الصورة */
    .portrait-wrap {
      width: min(300px, 78vw);
      aspect-ratio: 4 / 5;

      margin: 0 auto 12px;
      padding: 7px;

      background: linear-gradient(
        135deg,
        #f4e2b5,
        #886438 35%,
        #e1c27d 55%,
        #6f4b28
      );

      box-shadow: 0 8px 35px #080605a8;

      border: 1px solid #f0d69c;
    }

    /* صورة العروسين */
    .portrait {
      width: 100%;
      height: 100%;
      display: block;

      object-fit: cover;
      object-position: center 38%;

      filter: sepia(.12) contrast(1.03);
    }

    /* الزخرفة */
    .ornament {
      font-family: serif;
      color: var(--gold);
      font-size: 20px;
      letter-spacing: 8px;
      margin: 0 0 4px;
    }

    /* أسماء العروسين */
    .names {
      margin: 2px 0 8px;

      font-size: clamp(43px, 10vw, 66px);
      line-height: 1.2;
      font-weight: 400;

      color: #fff4dc;

      text-shadow: 0 3px 18px #1b0e0b;
    }

    /* القلب */
    .heart {
      font-size: 22px;
      color: #e3c581;
      margin: 0 8px;
    }

    /* رسالة الدعوة */
    .tagline {
      font-size: 20px;
      line-height: 1.5;

      max-width: 450px;

      margin: 8px auto 18px;

      color: #f4ead8;
    }

    /* كل جملة في سطر */
    .tagline span {
      display: block;
    }

    /* عداد المناسبة */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 8px;

      margin: 0 auto 16px;

      direction: ltr;
    }

    /* خانات العداد */
    .count-unit {
      min-width: 58px;
      padding: 5px 7px 3px;

      background: #160f0dbb;

      border: 1px solid #d2b77d66;
    }

    /* أرقام العداد */
    .count-unit strong {
      display: block;

      font-size: 21px;
      line-height: 1.15;

      color: #f0d69c;

      font-weight: 600;

      font-variant-numeric: tabular-nums;
    }

    /* أسماء وحدات العداد */
    .count-unit span {
      display: block;

      font-family: Georgia, serif;

      text-transform: uppercase;
      letter-spacing: 1px;

      font-size: 9px;

      color: #e4d2af;
    }

    /* التاريخ والمكان والميعاد */
    .event {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;

      margin: 12px auto 16px;

      color: #fff2d7;
    }

    /* عناصر المناسبة */
    .event-item {
      min-width: 0;
      flex: 1;
    }

    /* القيم الأساسية */
    .event-item strong {
      display: block;

      font-size: 17px;
      font-weight: 700;

      color: #e5cc91;
    }

    /* عناوين التاريخ والمكان والميعاد - خط أوضح وأكبر */
    .event-item span {
      display: block;

      font-size: 17px;
      font-weight: 700;

      margin-bottom: 6px;

      color: #f5dfb5;

      letter-spacing: 1px;
    }

    /* الخطوط الفاصلة */
    .separator {
      height: 40px;
      border-right: 1px solid #d2b77d99;
      flex-shrink: 0;
    }

    /* تنسيق ميعاد الخطوبة */
    .time-item strong {
      color: #f4d795 !important;
      font-size: 22px;

      text-shadow: 0 0 12px #d2b77d55;
    }

    /* رمز الساعة */
    .time-item strong::before {
      content: "◷ ";
      font-size: 18px;
    }

    /* عنوان الميعاد */
    .time-item span {
      color: #f5dfb5;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* بطاقة الموقع */
    .location-card {
      display: flex;
      align-items: center;
      gap: 13px;

      width: min(410px, 100%);

      margin: 4px auto 0;
      padding: 9px;

      text-align: left;
      text-decoration: none;

      color: #fff2d7;

      border: 1px solid #d2b77d;

      background: linear-gradient(135deg, #35291fcc, #1d1715ee);

      box-shadow: 0 8px 26px #10090677;

      transition: transform .25s, background .25s;
    }

    /* حركة بطاقة الموقع */
    .location-card:hover {
      transform: translateY(-3px);
      background: #3b2d21;
    }

    /* رسمة الخريطة */
    .map-art {
      position: relative;

      flex: 0 0 108px;
      height: 78px;

      overflow: hidden;

      border: 1px solid #d2b77d88;

      background:
        linear-gradient(27deg, transparent 0 32%, #b8a982 33% 36%, transparent 37%),
        linear-gradient(148deg, transparent 0 45%, #c5b58e 46% 50%, transparent 51%),
        linear-gradient(90deg, transparent 0 63%, #d7c9a7 64% 68%, transparent 69%),
        repeating-linear-gradient(0deg, #d9d0b7 0 1px, #e9dfc9 1px 20px),
        repeating-linear-gradient(90deg, transparent 0 23px, #c7b995 24px 25px, transparent 26px 46px);
    }

    /* اسم الموقع داخل الخريطة */
    .map-art::after {
      content: "OUR LOCATION";

      position: absolute;
      left: 5px;
      top: 5px;

      padding: 2px 5px;

      background: #f5ebd8e8;

      color: #493b2b;

      font: 600 8px Georgia, serif;

      letter-spacing: 1px;
    }

    /* دبوس الموقع */
    .map-pin {
      position: absolute;
      z-index: 1;

      left: 55%;
      top: 42%;

      width: 18px;
      height: 18px;

      border-radius: 50% 50% 50% 0;

      transform: rotate(-45deg);

      background: #702e3c;

      border: 2px solid #f3dfae;

      box-shadow: 0 2px 7px #24140f99;
    }

    /* مركز دبوس الموقع */
    .map-pin::after {
      content: "";

      position: absolute;

      left: 5px;
      top: 5px;

      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #f8e9c7;
    }

    /* نص بطاقة الموقع */
    .location-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* عنوان الموقع */
    .location-copy strong {
      font-size: 20px;
      font-weight: 600;

      color: #f0d69c;
    }

    /* وصف الموقع */
    .location-copy small {
      font: 11px Georgia, serif;
      color: #dfd1b6;
    }

    /* مساحة البتلات */
    .petals {
      position: absolute;
      z-index: 5;

      inset: 0;

      overflow: hidden;

      pointer-events: none;
    }

    /* شكل البتة */
    .petal {
      position: absolute;
      top: -35px;
      left: var(--left);

      width: var(--size);
      height: calc(var(--size) * 1.45);

      border-radius: 95% 5% 82% 18%;

      background: linear-gradient(
        140deg,
        #ff9a9e 0%,
        #ed394b 36%,
        #b5122d 72%,
        #760d24 100%
      );

      box-shadow:
        inset 2px 1px 3px #ffd0c255,
        0 2px 5px #30050b66;

      opacity: 0;

      transform-origin: center;

      animation: petal-fall var(--duration) ease-in var(--delay) forwards;
    }

    /* عرق البتة */
    .petal::after {
      content: "";

      position: absolute;

      left: 49%;
      top: 14%;

      width: 1px;
      height: 70%;

      background: linear-gradient(
        transparent,
        #ffd0c277,
        transparent
      );

      transform: rotate(-18deg);
    }

    /* حركة سقوط البتلات */
    @keyframes petal-fall {

      0% {
        opacity: 0;
        transform: translate3d(0, -4vh, 0) rotate(0deg);
      }

      10% {
        opacity: .88;
      }

      50% {
        transform: translate3d(var(--drift), 52vh, 0) rotate(230deg);
      }

      88% {
        opacity: .78;
      }

      100% {
        opacity: 0;
        transform: translate3d(calc(var(--drift) * -.55), 108vh, 0) rotate(520deg);
      }
    }

    /* بطاقة البداية */
    .gate {
      position: absolute;
      z-index: 4;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: min(380px, 84vw);

      text-align: center;

      transition:
        opacity .35s ease,
        transform .5s ease;
    }

    /* محتوى بطاقة البداية */
    .gate-inner {
      padding: 25px 18px 22px;

      background: linear-gradient(#281c17ec, #281c17e8);

      border: 1px solid #d2b77d;

      outline: 1px solid #d2b77d66;
      outline-offset: 5px;

      box-shadow: 0 12px 50px #0906059c;
    }

    /* الزخرفة */
    .gate-symbol {
      font-family: serif;
      color: var(--gold);
      font-size: 30px;
      margin: 0 0 4px;
    }

    /* أسماء العروسين في البداية */
    .gate h1 {
      font-weight: 400;

      font-size: clamp(28px, 7vw, 38px);

      line-height: 1.5;

      margin: 0;

      color: #fff1d6;
    }

    /* زر فتح الدعوة */
    .open-button {
      cursor: pointer;

      border: 1px solid var(--gold);

      background: #8c6738;

      color: #fff1d6;

      padding: 10px 26px;

      min-width: 172px;

      box-shadow: 0 4px 18px #10090677;

      transition: background .2s, transform .2s;
    }

    /* حركة الزر */
    .open-button:hover {
      background: #a17a45;
      transform: translateY(-2px);
    }

    /* اختفاء بطاقة البداية */
    .experience.opened .gate {
      opacity: 0;

      transform: translate(-50%, -50%) scale(.94);

      pointer-events: none;
    }

    /* ضبط الشاشات القصيرة */
    @media (max-height: 720px) {

      .content {
        padding: 14px;
      }

      .portrait-wrap {
        width: min(240px, 68vw);
        margin-bottom: 8px;
      }

      .tagline {
        font-size: 18px;
        margin: 5px auto 10px;
      }

      .event {
        margin: 8px auto 10px;
      }
    }

    /* ضبط الموبايلات الصغيرة */
    @media (max-width: 380px) {

      .event {
        gap: 7px;
      }

      .event-item strong {
        font-size: 15px;
      }

      .time-item strong {
        font-size: 18px;
      }

      /* تصغير العناوين للموبايلات الصغيرة */
      .event-item span {
        font-size: 14px;
      }

      .separator {
        height: 32px;
      }

      .countdown {
        gap: 5px;
      }

      .count-unit {
        min-width: 52px;
      }
    }

    /* تقليل الحركة لمن يفضل ذلك */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }

  </style>
</head>

<body>

  <!-- القسم الرئيسي -->
  <main class="experience" id="experience">

    <!-- تفاصيل الدعوة -->
    <section class="reveal"
             aria-label="Ali and Rehab's engagement invitation"
             aria-hidden="true">

      <!-- صندوق الدعوة -->
      <div class="content">

        <!-- إطار صورة العروسين -->
        <div class="portrait-wrap">

          <!-- صورة العروسين -->
          <img class="portrait"
               src="ali-rehab.jpeg"
               alt="Ali and Rehab">

        </div>

        <!-- الزخرفة -->
        <p class="ornament" aria-hidden="true">❧ ✦ ❧</p>

        <!-- أسماء العروسين -->
        <h2 class="names">
          Ali <span class="heart">♥</span> Rehab
        </h2>

        <!-- رسالة الدعوة -->
        <p class="tagline">
          <span>We're so happy to share our special day with you.</span>
          <span>Your presence means the world to us.</span>
        </p>

        <!-- العداد التنازلي -->
        <div class="countdown" aria-label="Countdown to the celebration">

          <div class="count-unit">
            <strong id="days">000</strong>
            <span>Days</span>
          </div>

          <div class="count-unit">
            <strong id="hours">00</strong>
            <span>Hours</span>
          </div>

          <div class="count-unit">
            <strong id="minutes">00</strong>
            <span>Minutes</span>
          </div>

          <div class="count-unit">
            <strong id="seconds">00</strong>
            <span>Seconds</span>
          </div>

        </div>

        <!-- التاريخ والمكان والميعاد -->
        <div class="event">

          <!-- التاريخ -->
          <div class="event-item">
            <span>Date</span>
            <strong id="date">December 12, 2026</strong>
          </div>

          <!-- الفاصل -->
          <div class="separator" aria-hidden="true"></div>

          <!-- المكان -->
          <div class="event-item">
            <span>The Place</span>
            <strong id="venue">Sky Town</strong>
          </div>

          <!-- الفاصل -->
          <div class="separator" aria-hidden="true"></div>

          <!-- ميعاد الخطوبة -->
          <div class="event-item time-item">
            <span>Engagement Time</span>
            <strong id="time">7:00 PM</strong>
          </div>

        </div>

        <!-- رابط الموقع -->
        <a class="location-card"
           id="mapLink"
           href="https://maps.app.goo.gl/41spuCuXvgvp3cBF6?g_st=aw"
           target="_blank"
           rel="noreferrer"
           aria-label="Open Sky Town in Google Maps">

          <!-- رسمة الخريطة -->
          <span class="map-art" aria-hidden="true">

            <!-- دبوس الموقع -->
            <span class="map-pin"></span>

          </span>

          <!-- تفاصيل الموقع -->
          <span class="location-copy">

            <strong>Our Location</strong>

            <small>Tap to open in Google Maps ↗</small>

          </span>

        </a>

      </div>

    </section>

    <!-- مساحة البتلات -->
    <div class="petals" id="petals" aria-hidden="true"></div>

    <!-- بطاقة البداية -->
    <div class="gate">

      <div class="gate-inner">

        <!-- زخرفة -->
        <p class="gate-symbol" aria-hidden="true">❧</p>

        <!-- أسماء العروسين -->
        <h1>Ali &amp; Rehab</h1>

        <!-- زر فتح الدعوة -->
        <button class="open-button"
                id="openButton"
                type="button">
          Open the Invitation
        </button>

      </div>

    </div>

    <!-- الأغنية -->
    <audio id="invitationSong" preload="auto">

      <source src="Music.mp3" type="audio/mp3">

    </audio>

  </main>

  <script>

    // بيانات المناسبة
    const invitation = {

      // تاريخ الخطوبة
      date: "December 12, 2026",

      // مكان الخطوبة
      venue: "Sky Town",

      // ميعاد الخطوبة
      time: "7:00 PM",

      // رابط الموقع
      map: "https://maps.app.goo.gl/41spuCuXvgvp3cBF6?g_st=aw",

      // موعد الخطوبة الساعة 7 مساءً بتوقيت مصر
      eventAt: "2026-12-12T19:00:00+02:00"
    };

    // عرض التاريخ
    document.getElementById("date").textContent = invitation.date;

    // عرض المكان
    document.getElementById("venue").textContent = invitation.venue;

    // عرض الميعاد
    document.getElementById("time").textContent = invitation.time;

    // إضافة رابط الخريطة
    document.getElementById("mapLink").href = invitation.map;

    // تحويل موعد الخطوبة إلى وقت قابل للحساب
    const eventTime = new Date(invitation.eventAt).getTime();

    // أسماء عناصر العداد
    const countdownIds = ["days", "hours", "minutes", "seconds"];

    // تحديث العداد
    function updateCountdown() {

      // الوقت المتبقي
      const remaining = Math.max(0, eventTime - Date.now());

      // حساب الأيام والساعات والدقائق والثواني
      const values = [

        // الأيام
        Math.floor(remaining / 86400000),

        // الساعات
        Math.floor((remaining % 86400000) / 3600000),

        // الدقائق
        Math.floor((remaining % 3600000) / 60000),

        // الثواني
        Math.floor((remaining % 60000) / 1000)
      ];

      // عرض قيم العداد
      values.forEach((value, index) => {

        document.getElementById(countdownIds[index]).textContent =

          // إضافة صفر للأرقام الصغيرة
          index === 0
            ? String(value)
            : String(value).padStart(2, "0");

      });
    }

    // تشغيل العداد فور فتح الصفحة
    updateCountdown();

    // تحديث العداد كل ثانية
    setInterval(updateCountdown, 1000);

    // الوصول للقسم الرئيسي
    const experience = document.getElementById("experience");

    // الوصول لزر فتح الدعوة
    const openButton = document.getElementById("openButton");

    // الوصول للأغنية
    const invitationSong = document.getElementById("invitationSong");

    // عند الضغط على زر فتح الدعوة
    openButton.addEventListener("click", () => {

      // إظهار تفاصيل الدعوة
      experience.classList.add("opened");

      // بدء حركة الانتقال بين البابين
      experience.classList.add("door-open");

      // إظهار الدعوة لقارئات الشاشة
      document.querySelector(".reveal")
        .setAttribute("aria-hidden", "false");

      // تشغيل الأغنية
      invitationSong.play().catch(() => {

        // رسالة في حالة تعذر تشغيل الأغنية
        console.log("تأكدي إن ملف الأغنية موجود في المسار الصحيح.");

      });

      // الوصول إلى مساحة البتلات
      const petals = document.getElementById("petals");

      // منع تكرار البتلات
      if (petals.childElementCount) return;

      // إنشاء 10 بتلات
      for (let i = 0; i < 10; i++) {

        // إنشاء عنصر البتة
        const petal = document.createElement("i");

        // إضافة تنسيق البتة
        petal.className = "petal";

        // تحديد مكان البتة عشوائيًا
        petal.style.setProperty(
          "--left",
          `${Math.random() * 100}%`
        );

        // تحديد حجم البتة
        petal.style.setProperty(
          "--size",
          `${9 + Math.random() * 10}px`
        );

        // تحديد مدة سقوط البتة
        petal.style.setProperty(
          "--duration",
          `${5.5 + Math.random() * 4}s`
        );

        // تحديد وقت بداية الحركة
        petal.style.setProperty(
          "--delay",
          `${Math.random() * 7}s`
        );

        // تحديد اتجاه الحركة
        petal.style.setProperty(
          "--drift",
          `${-60 + Math.random() * 120}px`
        );

        // إضافة البتة إلى الصفحة
        petals.appendChild(petal);

      }

    });

  </script>

</body>
